<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Meowdoku 🐱</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
</head>

<body>
  <header class="app-header">
    <h1>🐱 Meowdoku</h1>
    <button id="btn-clear-cache" class="icon-btn" aria-label="清除快取" title="清除快取">🗑️</button>
  </header>

  <main id="app">
    <section id="screen-select" class="screen">
      <h2>選擇模式</h2>
      <div id="size-buttons" class="button-grid"></div>

      <h2>選擇關卡</h2>
      <div id="level-buttons" class="button-grid"></div>
    </section>

    <section id="screen-game" class="screen hidden">
      <div class="game-toolbar">
        <button id="btn-back" class="icon-btn" aria-label="返回" title="返回">←</button>
        <span id="game-title"></span>
        <span class="top-bar-right">
          <button id="btn-settings" class="icon-btn" aria-label="設定" title="設定">⚙️</button>
        </span>
      </div>
      <div class="game-toolbar">
        <span></span>
        <span class="top-bar-right">
          <span id="timer" class="timer">0:00</span>
          <span id="hearts" class="hearts"></span>
        </span>
      </div>
      <div class="game-toolbar tool-row">
        <button id="btn-restart" class="tool-toggle">重來 ⟲</button>
        <button id="btn-toggle-hypo" class="tool-toggle">假設 △</button>
      </div>
      <div id="board" class="board"></div>
      <div class="game-toolbar tool-row">
        <button id="btn-undo" class="tool-toggle" disabled>復原 ↶</button>
        <button id="btn-redo" class="tool-toggle" disabled>重做 ↷</button>
        <button id="btn-copy-ascii" class="tool-toggle hidden">ascii</button>
        <button id="btn-copy-link" class="tool-toggle hidden">連結</button>
      </div>
      <div id="status-banner" class="status-banner hidden"></div>

      <div id="win-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-emoji">🎉</div>
          <div class="modal-title">完成！</div>
          <div id="win-time" class="modal-subtitle"></div>
          <div class="modal-buttons">
            <button id="btn-modal-back" class="secondary">選關</button>
            <button id="btn-replay" class="secondary">重玩</button>
            <button id="btn-next-level">下一關</button>
          </div>
        </div>
      </div>
      <div id="help-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-emoji">🐱</div>
          <div class="modal-title" style="font-size:1.1rem;margin-bottom:16px">遊戲說明</div>
          <div class="help-content">
            <h3>規則</h3>
            <ul>
              <li>每行一隻貓、每列一隻貓</li>
              <li>兩隻貓不能相鄰（含斜角）</li>
              <li>每個顏色區域恰好一隻貓</li>
            </ul>
            <h3>操作</h3>
            <ul>
              <li><b>點一下</b>：打叉標記 / 取消</li>
              <li><b>快速點兩下</b>：猜這格有貓（答錯扣一顆心）</li>
              <li><b>按住拖曳</b>：整排塗成同狀態</li>
              <li><b>按空白鍵</b>：切換假設模式</li>
              <li><b>按 c</b>：複製盤面連結（可分享目前進度）</li>
            </ul>
          </div>
          <div class="modal-buttons">
            <button id="btn-help-close">關閉</button>
          </div>
        </div>
      </div>
      <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-box settings-box">
          <div class="modal-title" style="font-size:1.1rem;margin-bottom:16px">設定</div>
          <div class="settings-section">
            <div class="settings-row">
              <span>音效</span>
              <button id="btn-toggle-sound" class="tool-toggle">🔊</button>
            </div>
            <div class="settings-row">
              <span>振動</span>
              <button id="btn-toggle-vibrate" class="tool-toggle">📳</button>
            </div>
            <div class="settings-row">
              <span>自動排除</span>
              <button id="btn-toggle-auto" class="tool-toggle">開</button>
            </div>
            <div class="settings-row">
              <span>排除的格子變暗</span>
              <button id="btn-toggle-dim" class="tool-toggle">開</button>
            </div>
            <div class="settings-row">
              <span>複製盤面（ascii／連結）</span>
              <button id="btn-toggle-copy-ascii" class="tool-toggle">關</button>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-row">
              <span>調色盤</span>
              <button id="btn-palette-reset" class="tool-toggle">恢復預設</button>
            </div>
            <div id="palette-editor" class="palette-editor"></div>
          </div>
          <div class="settings-section">
            <div class="settings-row">
              <span>關卡進度</span>
              <span class="progress-buttons">
                <button id="btn-export-progress" class="tool-toggle">匯出</button>
                <button id="btn-import-progress" class="tool-toggle">匯入</button>
              </span>
            </div>
            <div id="import-panel" class="import-panel hidden">
              <textarea id="import-text" class="import-text" rows="3" spellcheck="false"
                placeholder="貼上匯出的進度，會與現有進度合併（同一關取星數高的）"></textarea>
              <div class="import-actions">
                <button id="btn-import-cancel" class="tool-toggle">取消</button>
                <button id="btn-import-confirm" class="tool-toggle">合併</button>
              </div>
            </div>
          </div>
          <div class="modal-buttons">
            <button id="btn-help-open" class="secondary">遊戲說明</button>
            <button id="btn-settings-close">關閉</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="ios-install-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="ios-install-title">
    <div class="modal-box">
      <div class="modal-emoji">📲</div>
      <div id="ios-install-title" class="modal-title">加入 iOS 主畫面</div>
      <div class="modal-subtitle">在 Safari 或 Chrome 點「分享」，再選擇「加入主畫面」。</div>
      <div class="modal-buttons">
        <button id="btn-ios-install-ok">知道了</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
        .catch((error) => console.error("Service worker registration failed", error));
    }
  </script>
  <script src="game.js"></script>
</body>

</html>
