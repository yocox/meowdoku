<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Meowdoku 🐱</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
</head>

<body>
  <header class="app-header">
    <h1>🐱 Meowdoku</h1>
  </header>

  <main id="app">
    <section id="screen-select" class="screen">
      <h2>選擇盤面大小</h2>
      <div id="size-buttons" class="button-grid"></div>

      <h2>選擇關卡</h2>
      <div id="level-buttons" class="button-grid"></div>
    </section>

    <section id="screen-game" class="screen hidden">
      <div class="game-toolbar">
        <button id="btn-back">← 返回</button>
        <span id="game-title"></span>
        <span id="hearts" class="hearts"></span>
      </div>
      <div class="game-toolbar tool-row">
        <button id="btn-restart">重來</button>
        <button id="btn-toggle-sound" class="tool-toggle">🔊音效</button>
        <button id="btn-toggle-vibrate" class="tool-toggle">📳振動</button>
        <button id="btn-toggle-auto" class="tool-toggle">自動排除</button>
        <button id="btn-toggle-hypo" class="tool-toggle">△假設</button>
        <button id="btn-help" class="tool-toggle">？說明</button>
      </div>
      <div id="board" class="board"></div>
      <div id="status-banner" class="status-banner hidden"></div>

      <div id="win-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-emoji">🎉</div>
          <div class="modal-title">完成！</div>
          <div class="modal-buttons">
            <button id="btn-modal-back" class="secondary">選關</button>
            <button id="btn-replay" class="secondary">重玩</button>
            <button id="btn-next-level">下一關</button>
          </div>
        </div>
      </div>
      <div id="help-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-emoji">🐱</div>
          <div class="modal-title" style="font-size:1.1rem;margin-bottom:16px">遊戲說明</div>
          <div class="help-content">
            <h3>規則</h3>
            <ul>
              <li>每行一隻貓、每列一隻貓</li>
              <li>兩隻貓不能相鄰（含斜角）</li>
              <li>每個顏色區域恰好一隻貓</li>
            </ul>
            <h3>操作</h3>
            <ul>
              <li><b>點一下</b>：打叉標記 / 取消</li>
              <li><b>快速點兩下</b>：猜這格有貓（答錯扣一顆心）</li>
              <li><b>按住拖曳</b>：整排塗成同狀態</li>
            </ul>
          </div>
          <div class="modal-buttons">
            <button id="btn-help-close">關閉</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>

</html>
